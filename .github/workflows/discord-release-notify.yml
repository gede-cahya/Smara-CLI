name: Discord Release Notifier

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  notify-discord:
    name: Notify Discord Channel
    runs-on: ubuntu-latest
    steps:
      - name: Send Release Notification to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TITLE: ${{ github.event.release.name || github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          RELEASE_URL: ${{ github.event.release.html_url || format('https://github.com/{0}/releases/tag/{1}', github.repository, github.ref_name) }}
          RELEASE_BODY: ${{ github.event.release.body || 'New release update available.' }}
          REPO_NAME: ${{ github.repository }}
          AUTHOR: ${{ github.event.release.author.login || github.actor }}
          AUTHOR_AVATAR: ${{ github.event.release.author.avatar_url || format('https://github.com/{0}.png', github.actor) }}
          ASSETS_JSON: ${{ toJson(github.event.release.assets) }}
        run: |
          WEBHOOK_URL="${DISCORD_WEBHOOK:-https://discord.com/api/webhooks/1531906488673501258/yWGWphOOQloBD4UtxnEWsGXAkuSQQIDSbIHw5a2SEg6254klUH0VJyCUiOkvPsxAntuT}"

          TITLE="${RELEASE_TITLE:-$RELEASE_TAG}"
          HEADER="# 🌀 $TITLE Released!

"
          FULL_BODY="${HEADER}${RELEASE_BODY}"

          # Construct JSON payload via node
          PAYLOAD=$(node -e '
            const title = process.env.TITLE;
            const releaseUrl = process.env.RELEASE_URL;
            const repoName = process.env.REPO_NAME;
            const tag = process.env.RELEASE_TAG;
            const author = process.env.AUTHOR || "cahya";
            const avatar = process.env.AUTHOR_AVATAR || "https://github.com/gede-cahya.png";
            const body = process.env.FULL_BODY || "";
            let assets = [];
            try {
              assets = JSON.parse(process.env.ASSETS_JSON || "[]");
            } catch (e) {}

            let desc = body.trim();
            if (desc.length > 1900) {
              desc = desc.substring(0, 1897) + "...";
            }

            const fields = [
              { name: "📌 Version Tag", value: "`" + tag + "`", inline: true },
              { name: "📦 Repository", value: "[" + repoName + "](https://github.com/" + repoName + ")", inline: true }
            ];

            if (assets && assets.length > 0) {
              const assetLines = assets.slice(0, 6).map(a => {
                const sizeMB = (a.size / (1024 * 1024)).toFixed(1);
                return "• [" + a.name + "](" + a.browser_download_url + ") (" + sizeMB + " MB)";
              }).join("\n");
              fields.push({ name: "💾 Downloads / Assets", value: assetLines, inline: false });
            }

            const payload = {
              username: "Smara Release Bot",
              avatar_url: "https://raw.githubusercontent.com/" + repoName + "/main/web/public/favicon.ico",
              embeds: [
                {
                  title: "🚀 New Release: " + title,
                  url: releaseUrl,
                  description: desc,
                  color: 8214260,
                  author: {
                    name: author,
                    icon_url: avatar
                  },
                  fields: fields,
                  footer: {
                    text: "🌀 Smara Discord Integration • GitHub Release Notification"
                  }
                }
              ]
            };
            console.log(JSON.stringify(payload));
          ')

          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK_URL"
          echo "✅ Notifikasi GitHub Release terkirim ke Discord!"
