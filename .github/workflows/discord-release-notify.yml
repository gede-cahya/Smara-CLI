name: Discord Release Notifier

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  notify-discord:
    name: Notify Discord Channel
    runs-on: ubuntu-latest
    steps:
      - name: Send Release Notification to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TITLE: ${{ github.event.release.name || github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          RELEASE_URL: ${{ github.event.release.html_url || format('https://github.com/{0}/releases/tag/{1}', github.repository, github.ref_name) }}
          RELEASE_BODY: ${{ github.event.release.body || 'New release update available.' }}
          REPO_NAME: ${{ github.repository }}
          AUTHOR: ${{ github.event.release.author.login || github.actor }}
          AUTHOR_AVATAR: ${{ github.event.release.author.avatar_url || format('https://github.com/{0}.png', github.actor) }}
          ASSETS_JSON: ${{ toJson(github.event.release.assets) }}
        run: |
          python3 -c '
          import os, json, urllib.request

          webhook_url = os.getenv("DISCORD_WEBHOOK") or "https://discord.com/api/webhooks/1531906488673501258/yWGWphOOQloBD4UtxnEWsGXAkuSQQIDSbIHw5a2SEg6254klUH0VJyCUiOkvPsxAntuT"
          title = os.getenv("RELEASE_TITLE") or os.getenv("RELEASE_TAG") or "Release"
          tag = os.getenv("RELEASE_TAG") or "v1.0"
          repo = os.getenv("REPO_NAME") or "Gede-Cahya/Smara-CLI"
          url = os.getenv("RELEASE_URL") or f"https://github.com/{repo}"
          body = os.getenv("RELEASE_BODY") or "New release update available."
          author = os.getenv("AUTHOR") or "cahya"
          avatar = os.getenv("AUTHOR_AVATAR") or f"https://github.com/{author}.png"
          assets_raw = os.getenv("ASSETS_JSON") or "[]"

          try:
              assets = json.loads(assets_raw)
          except:
              assets = []

          desc = f"# 🌀 {title} Released!\n\n{body}"
          if len(desc) > 1900:
              desc = desc[:1897] + "..."

          fields = [
              {"name": "📌 Version Tag", "value": f"`{tag}`", "inline": True},
              {"name": "📦 Repository", "value": f"[{repo}](https://github.com/{repo})", "inline": True}
          ]

          if assets and isinstance(assets, list):
              asset_lines = []
              for a in assets[:6]:
                  name = a.get("name", "asset")
                  dl_url = a.get("browser_download_url", url)
                  size_mb = round(a.get("size", 0) / (1024 * 1024), 1)
                  asset_lines.append(f"• [{name}]({dl_url}) ({size_mb} MB)")
              if asset_lines:
                  fields.append({"name": "💾 Downloads / Assets", "value": "\n".join(asset_lines), "inline": False})

          payload = {
              "username": "Smara Release Bot",
              "avatar_url": f"https://raw.githubusercontent.com/{repo}/main/web/public/favicon.ico",
              "embeds": [{
                  "title": f"🚀 New Release: {title}",
                  "url": url,
                  "description": desc,
                  "color": 8214260,
                  "author": {"name": author, "icon_url": avatar},
                  "fields": fields,
                  "footer": {"text": "🌀 Smara Discord Integration • GitHub Release Notification"}
              }]
          }

          req = urllib.request.Request(webhook_url, data=json.dumps(payload).encode("utf-8"), headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req)
          print("✅ Notifikasi GitHub Release terkirim ke Discord!")
          '
