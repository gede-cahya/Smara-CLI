name: Bansos Dev Notifier

on:
  schedule:
    - cron: '0 * * * *' # Jalan setiap 1 jam
  workflow_dispatch: # Bisa dijalankan manual dari GitHub Actions tab

jobs:
  notify-bansos:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Diperlukan untuk commit posted_bansos.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Bansos Fetcher & Send to Discord
        env:
          DISCORD_WEBHOOK_URL_BANSOS: ${{ secrets.DISCORD_WEBHOOK_URL_BANSOS || 'https://discord.com/api/webhooks/1532392433000775770/wXZOzkXMf3zxF3oSaoUwceAJJbF3dP0yNbLzV4iGVIOz7DXyUXpvRC8q2axv9yKjvaXO' }}
        run: |
          python scripts/bansos_notifier.py

      - name: Commit & Push state tracking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_bansos.json || true
          git diff --staged --quiet || (git commit -m "update: posted_bansos state" && git push)
