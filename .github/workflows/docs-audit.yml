name: Docs Audit

on:
  pull_request:
    paths:
      - 'cmd/smara/**'
      - 'docs-site/**'
      - 'scripts/audit-docs-cli.mjs'
      - '.github/workflows/docs-audit.yml'
  push:
    branches: [main]
    paths:
      - 'cmd/smara/**'
      - 'docs-site/**'
      - 'scripts/audit-docs-cli.mjs'
      - '.github/workflows/docs-audit.yml'

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json
      - name: Install docs dependencies
        working-directory: docs-site
        run: npm ci
      - name: Build docs
        working-directory: docs-site
        run: npm run docs:build
      - name: Audit CLI docs coverage
        run: node scripts/audit-docs-cli.mjs
