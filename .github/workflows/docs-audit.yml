name: Docs Audit

on:
  pull_request:
    paths:
      - 'cmd/smara/**'
      - 'docs-site/**'
      - 'scripts/audit-docs-cli.mjs'
      - '.github/workflows/docs-audit.yml'
  push:
    branches: [main]
    paths:
      - 'cmd/smara/**'
      - 'docs-site/**'
      - 'scripts/audit-docs-cli.mjs'
      - '.github/workflows/docs-audit.yml'

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Detect embedded docs site
        id: docs_site
        shell: bash
        run: |
          if [[ -f docs-site/package.json && -f docs-site/package-lock.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "docs-site is managed in the separate smara-docs repository; skipping embedded docs build/audit."
          fi
      - name: Install docs dependencies
        if: steps.docs_site.outputs.present == 'true'
        working-directory: docs-site
        run: npm ci
      - name: Build docs
        if: steps.docs_site.outputs.present == 'true'
        working-directory: docs-site
        run: npm run docs:build
      - name: Audit CLI docs coverage
        if: steps.docs_site.outputs.present == 'true'
        run: node scripts/audit-docs-cli.mjs
